name: 'la_smart_dining_radar'
version: '2.0.0'
config-version: 2
profile: 'la_smart_dining_radar'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Entity-matching thresholds (v2). Kept as vars so they are visible and tunable in one place.
  match_max_distance_m: 150
  match_min_score: 0.6

models:
  la_smart_dining_radar:
    # v1: Yelp-based dashboard (unchanged)
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    # v2: open-data landscape monitor
    v2:
      +tags: ['v2']
      staging:
        +materialized: view
      intermediate:
        +materialized: table
      marts:
        +materialized: table

snapshots:
  la_smart_dining_radar:
    +tags: ['v2']
